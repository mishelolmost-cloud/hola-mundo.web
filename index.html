<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hola Mundo</title>
  <style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #74ebd5, #9face6);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .contenedor {
        background-color: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
        color: #5a4fcf;
        font-size: 40px;
        margin-bottom: 10px;
    }

    p {
        color: #555;
        font-size: 20px;
    }

    button {
        background-color: #934fcf;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background-color: #3592a3;
    }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>¡HOLA MUNDO!</h1>
    <p>Esta es mi primera pagina web en la nube</p>
    <button>Aceptar</button>
  </div>
</body>
</html>
